name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with zero dependencies
        run: |
          pip install .
          python -c "import exptrail; print(exptrail.__version__)"
          exptrail --help
      - name: Install test extras
        run: pip install -e ".[dev]" numpy scikit-learn
      - name: Run tests
        run: pytest --cov=exptrail --cov-report=term-missing
      - name: Verify README numbers against saved runs
        run: exptrail verify README.md examples/digits/README.md
